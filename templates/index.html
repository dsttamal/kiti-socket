<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 28px 24px 28px;
            width: 420px;
            max-width: 95vw;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-weight: 700;
            text-align: center;
        }
        #messageLog {
            border: none;
            background: #f7f7fa;
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            height: 240px;
            overflow-y: auto;
            margin-bottom: 18px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .msg {
            margin-bottom: 8px;
            padding: 7px 12px;
            border-radius: 6px;
            display: inline-block;
            max-width: 85%;
            word-break: break-word;
        }
        .sent {
            background: #e3f0ff;
            color: #2563eb;
            align-self: flex-end;
            text-align: right;
        }
        .received {
            background: #e6fbe8;
            color: #15803d;
            align-self: flex-start;
            text-align: left;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        #messageInput:focus {
            border: 1.5px solid #2563eb;
        }
        #sendMessage {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        #sendMessage:hover {
            background: #1749a7;
        }
    </style>
</head>


<body>
<div class="container">
    <h2>Socket.IO Chat</h2>
    <div id="messageLog"></div>
    <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off">
        <button id="sendMessage">Send</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Connect to the Socket.IO server
        const socket = io.connect('http://206.189.143.56:5000');

        // Handle connection events
        socket.on('connect', function () {
            console.log('Connected to Flask Socket.IO server');
        });

        socket.on('disconnect', function () {
            console.log('Disconnected from Flask Socket.IO server');
        });

        // Add your custom event listeners here

        // Helper to append messages to the log
        function appendMessage(msg, type) {
            const log = document.getElementById('messageLog');
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.textContent = (type === 'sent' ? 'You: ' : 'Server: ') + (typeof msg === 'object' ? JSON.stringify(msg) : msg);
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        socket.on('message', function(data) {
            appendMessage(data, 'received');
            console.log('Received data:', data);
        });

        // Example: Emit a message to the server
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message) {
                socket.send(message);
                appendMessage(message, 'sent');
                input.value = '';
                input.focus();
            }
        }
        document.getElementById('sendMessage').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    });
</script>



</body>
</html>
